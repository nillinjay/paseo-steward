name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      # The check suite is machine-local by design: it inspects this repository and never the network. Checks that need
      # a live Paseo daemon or bubblewrap skip themselves and say so.
      - run: ./tools/suite.sh
